<div class="mood-content-box">
  <h2>Com'è il tuo umore oggi?</h2>
  <p>Seleziona l'emozione che meglio descrive come ti senti.</p>

  <div class="mood-options">
    <button *ngFor="let mood of moods"
            class="mood-btn"
            (click)="selectMood(mood.value)"
            [class.selected]="selectedMood === mood.value"
            [disabled]="isSubmitting">
      <span class="mood-icon">{{ mood.icon }}</span>
      {{ mood.value | titlecase }}
    </button>
  </div>

  <p *ngIf="submitError" class="mood-error">{{ submitError }}</p>

  <button class="submit-mood-btn"
          (click)="submitMood()"
          [disabled]="!selectedMood || isSubmitting">
    {{ isSubmitting ? 'Salvataggio...' : 'Conferma' }}
  </button>
</div>
